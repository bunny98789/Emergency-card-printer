<!DOCTYPE html>
<html>
<head>
    <title>Emergency Card Printer</title>

    
    <style>
   body{
    background: linear-gradient(135deg,#3a7bd5,#00d2ff);
    font-family: Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
}

h1{
    color:white;
    margin-bottom:20px;
}

.input{
    width:250px;
    padding:10px;
    margin:6px;
    border-radius:6px;
    border:none;
    font-size:14px;
}

.input:focus{
    outline:2px solid #ffffff;
}

.button{
    width:270px;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    background:white;
    color:#3a7bd5;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.button:hover{
    background:#f0f0f0;
}
 #card{
    margin-top:20px;
    width:3.5in;
    height:2in;
    background:white;
    border:2px solid black;
    border-radius:10px;
    padding:10px;
    box-sizing:border-box;
    font-size:12px;
}
        #qrcode{
    margin-top:5px;
}

      @media print {

body *{
    visibility:hidden;
}

#card, #card *{
    visibility:visible;
}

#card{
    position:absolute;
    left:0;
    top:0;
    width:3.5in;
    height:2in;
    border:2px solid black;
}

}
</style>
    
</head>  
    <body>
        <h1>CARD INFO</h1>
        
<input id="firstName" class="input" placeholder="first name">
<input id="lastName" class="input" placeholder="last name">
<input id="allergy" class="input" placeholder="allergy">
<input id="emergencyContact" class="input" placeholder="emergency contact">
<button id="print" class="button">Print</button>

        <div id="qrcode"></div>
        
        <div id="card">
            <h2>Emergency Card</h2>
            <p id="cardName"></p>
            <p id="cardAllergy"></p>
            <p id="cardContact"></p>
            </div>
    </body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
const fn = document.getElementById("firstName");
const ln = document.getElementById("lastName");
const allergy = document.getElementById("allergy");
const ec = document.getElementById("emergencyContact");
const printBtn = document.getElementById("print");

let qr;

printBtn.addEventListener("click", () => {

    const info =
        "Name: " + fn.value + " " + ln.value +
        "\nAllergy: " + allergy.value +
        "\nEmergency Contact: " + ec.value;

    document.getElementById("cardName").textContent =
        "Name: " + fn.value + " " + ln.value;

    document.getElementById("cardAllergy").textContent =
        "Allergy: " + allergy.value;

    document.getElementById("cardContact").textContent =
        "Emergency Contact: " + ec.value;

    document.getElementById("qrcode").innerHTML = "";

    qr = new QRCode(document.getElementById("qrcode"), {
        text: info,
        width: 64,
        height: 64
    });

    setTimeout(() => {
        window.print();
    }, 200);

});

    </script>
    </html>
